<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Režimová opatření</title>
<style>
  html,body{margin:0;padding:0;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  .wrap{max-width:400px;margin:0 auto;padding:0 10px 24px;}
  svg{width:100%;height:auto;display:block;}
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 380 1720" role="img">
<title>Režimová opatření při dysfagii v reálné mobilní velikosti písma</title>
<desc>Čtyři bubliny se zásadními režimovými opatřeními uspořádané v jednom sloupci na šířku telefonu, s písmem ve skutečné přístupné velikosti 16 až 20 pixelů.</desc>
<rect x="20" y="20" width="340" height="454" rx="20" fill="#FBE4B8" opacity="0.6" stroke="#F0CE8C" stroke-width="1.5"/>
<text x="36" y="54" style="font-size:20px;font-weight:600;fill:#8F5A0E">Před jídlem</text>
<circle cx="36" cy="84" r="3.5" fill="#F0CE8C"/>
<text x="48" y="90" style="font-size:17px;font-weight:600;fill:#8F5A0E">Vzpřímený sed</text>
<text x="48" y="112" style="font-size:16px;fill:#A67A2E">Sedí zpříma, hlava mírně</text>
<text x="48" y="132" style="font-size:16px;fill:#A67A2E">předkloněná. Nikdy vleže.</text>
<circle cx="36" cy="148" r="3.5" fill="#F0CE8C"/>
<text x="48" y="154" style="font-size:17px;font-weight:600;fill:#8F5A0E">Klid a čas</text>
<text x="48" y="176" style="font-size:16px;fill:#A67A2E">Klidné prostředí bez spěchu,</text>
<text x="48" y="196" style="font-size:16px;fill:#A67A2E">dostatek času na jídlo.</text>
<circle cx="36" cy="212" r="3.5" fill="#F0CE8C"/>
<text x="48" y="218" style="font-size:17px;font-weight:600;fill:#8F5A0E">Čistá ústa</text>
<text x="48" y="240" style="font-size:16px;fill:#A67A2E">Před jídlem zkontrolujeme</text>
<text x="48" y="260" style="font-size:16px;fill:#A67A2E">hygienu dutiny ústní.</text>
<circle cx="36" cy="276" r="3.5" fill="#F0CE8C"/>
<text x="48" y="282" style="font-size:17px;font-weight:600;fill:#8F5A0E">Kontrola pomůcek</text>
<text x="48" y="304" style="font-size:16px;fill:#A67A2E">Brýle, naslouchátko a pevně</text>
<text x="48" y="324" style="font-size:16px;fill:#A67A2E">držící zubní protéza.</text>
<circle cx="36" cy="340" r="3.5" fill="#F0CE8C"/>
<text x="48" y="346" style="font-size:17px;font-weight:600;fill:#8F5A0E">Vhodné náčiní</text>
<text x="48" y="368" style="font-size:16px;fill:#A67A2E">Lžička, hrnek s výřezem</text>
<text x="48" y="388" style="font-size:16px;fill:#A67A2E">nebo brčko dle logopeda.</text>
<circle cx="36" cy="404" r="3.5" fill="#F0CE8C"/>
<text x="48" y="410" style="font-size:17px;font-weight:600;fill:#8F5A0E">Upravená konzistence</text>
<text x="48" y="432" style="font-size:16px;fill:#A67A2E">Dle logopeda zahušťujeme</text>
<text x="48" y="452" style="font-size:16px;fill:#A67A2E">tekutiny a mixujeme stravu.</text>
<rect x="20" y="490" width="340" height="582" rx="20" fill="#F8D6E4" opacity="0.6" stroke="#F0B8D0" stroke-width="1.5"/>
<text x="36" y="524" style="font-size:20px;font-weight:600;fill:#A8355A">Během jídla</text>
<circle cx="36" cy="554" r="3.5" fill="#F0B8D0"/>
<text x="48" y="560" style="font-size:17px;font-weight:600;fill:#A8355A">Hlava v ose</text>
<text x="48" y="582" style="font-size:16px;fill:#D46B9A">Nikdy nezakláníme, případně</text>
<text x="48" y="602" style="font-size:16px;fill:#D46B9A">speciální hrneček.</text>
<circle cx="36" cy="618" r="3.5" fill="#F0B8D0"/>
<text x="48" y="624" style="font-size:17px;font-weight:600;fill:#A8355A">Malá sousta</text>
<text x="48" y="646" style="font-size:16px;fill:#D46B9A">Menší sousta, důkladně</text>
<text x="48" y="666" style="font-size:16px;fill:#D46B9A">a pomalu rozkoušeme.</text>
<circle cx="36" cy="682" r="3.5" fill="#F0B8D0"/>
<text x="48" y="688" style="font-size:17px;font-weight:600;fill:#A8355A">Bez míchání textur</text>
<text x="48" y="710" style="font-size:16px;fill:#D46B9A">Nemícháme pevné s tekutým,</text>
<text x="48" y="730" style="font-size:16px;fill:#D46B9A">hrozí riziko vdechnutí.</text>
<circle cx="36" cy="746" r="3.5" fill="#F0B8D0"/>
<text x="48" y="752" style="font-size:17px;font-weight:600;fill:#A8355A">Podpora samostatnosti</text>
<text x="48" y="774" style="font-size:16px;fill:#D46B9A">Necháme jíst samostatně,</text>
<text x="48" y="794" style="font-size:16px;fill:#D46B9A">případně navedeme ruku.</text>
<circle cx="36" cy="810" r="3.5" fill="#F0B8D0"/>
<text x="48" y="816" style="font-size:17px;font-weight:600;fill:#A8355A">Prázdná ústa</text>
<text x="48" y="838" style="font-size:16px;fill:#D46B9A">Další sousto až po zcela</text>
<text x="48" y="858" style="font-size:16px;fill:#D46B9A">prázdných ústech.</text>
<circle cx="36" cy="874" r="3.5" fill="#F0B8D0"/>
<text x="48" y="880" style="font-size:17px;font-weight:600;fill:#A8355A">Bez otázek a mluvení</text>
<text x="48" y="902" style="font-size:16px;fill:#D46B9A">Nepokládáme otázky,</text>
<text x="48" y="922" style="font-size:16px;fill:#D46B9A">u jídla nemluvíme.</text>
<circle cx="36" cy="938" r="3.5" fill="#F0B8D0"/>
<text x="48" y="944" style="font-size:17px;font-weight:600;fill:#A8355A">Zrakový kontakt</text>
<text x="48" y="966" style="font-size:16px;fill:#D46B9A">Jídlo v úrovni očí, krmící</text>
<text x="48" y="986" style="font-size:16px;fill:#D46B9A">osoba sedí níž.</text>
<circle cx="36" cy="1002" r="3.5" fill="#F0B8D0"/>
<text x="48" y="1008" style="font-size:17px;font-weight:600;fill:#A8355A">Přestávka při únavě</text>
<text x="48" y="1030" style="font-size:16px;fill:#D46B9A">Při únavě nebo ztrátě</text>
<text x="48" y="1050" style="font-size:16px;fill:#D46B9A">pozornosti přestáváme.</text>
<rect x="20" y="1088" width="340" height="262" rx="20" fill="#D6E6F5" opacity="0.6" stroke="#B8D4EE" stroke-width="1.5"/>
<text x="36" y="1122" style="font-size:20px;font-weight:600;fill:#1F5A94">Po jídle</text>
<circle cx="36" cy="1152" r="3.5" fill="#B8D4EE"/>
<text x="48" y="1158" style="font-size:17px;font-weight:600;fill:#1F5A94">Kontrola úst</text>
<text x="48" y="1180" style="font-size:16px;fill:#5C93C2">Zkontrolujeme a odstraníme</text>
<text x="48" y="1200" style="font-size:16px;fill:#5C93C2">zbytky jídla v ústech.</text>
<circle cx="36" cy="1216" r="3.5" fill="#B8D4EE"/>
<text x="48" y="1222" style="font-size:17px;font-weight:600;fill:#1F5A94">Vydržet vsedě</text>
<text x="48" y="1244" style="font-size:16px;fill:#5C93C2">Vzpřímeně sedět ještě</text>
<text x="48" y="1264" style="font-size:16px;fill:#5C93C2">20–30 minut po jídle.</text>
<circle cx="36" cy="1280" r="3.5" fill="#B8D4EE"/>
<text x="48" y="1286" style="font-size:17px;font-weight:600;fill:#1F5A94">Sledování příznaků</text>
<text x="48" y="1308" style="font-size:16px;fill:#5C93C2">Kašel, chraplavý hlas</text>
<text x="48" y="1328" style="font-size:16px;fill:#5C93C2">nebo zahlenění.</text>
<rect x="20" y="1366" width="340" height="326" rx="20" fill="#DCEBE0" opacity="0.6" stroke="#C4DDCC" stroke-width="1.5"/>
<text x="36" y="1400" style="font-size:20px;font-weight:600;fill:#4F7A5C">Hygiena úst</text>
<circle cx="36" cy="1430" r="3.5" fill="#C4DDCC"/>
<text x="48" y="1436" style="font-size:17px;font-weight:600;fill:#4F7A5C">Měkký kartáček</text>
<text x="48" y="1458" style="font-size:16px;fill:#8CBC9C">Šetrně odstraní plak,</text>
<text x="48" y="1478" style="font-size:16px;fill:#8CBC9C">nikdy ne tvrdý.</text>
<circle cx="36" cy="1494" r="3.5" fill="#C4DDCC"/>
<text x="48" y="1500" style="font-size:17px;font-weight:600;fill:#4F7A5C">Celá dutina ústní</text>
<text x="48" y="1522" style="font-size:16px;fill:#8CBC9C">Zuby, jazyk, patro</text>
<text x="48" y="1542" style="font-size:16px;fill:#8CBC9C">i vnitřní strana tváří.</text>
<circle cx="36" cy="1558" r="3.5" fill="#C4DDCC"/>
<text x="48" y="1564" style="font-size:17px;font-weight:600;fill:#4F7A5C">Voda především</text>
<text x="48" y="1586" style="font-size:16px;fill:#8CBC9C">Nejlepší přirozený</text>
<text x="48" y="1606" style="font-size:16px;fill:#8CBC9C">zvlhčovač sliznice.</text>
<circle cx="36" cy="1622" r="3.5" fill="#C4DDCC"/>
<text x="48" y="1628" style="font-size:17px;font-weight:600;fill:#4F7A5C">Opatrně s alkoholem</text>
<text x="48" y="1650" style="font-size:16px;fill:#8CBC9C">Ústní vody s alkoholem</text>
<text x="48" y="1670" style="font-size:16px;fill:#8CBC9C">vysušují sliznici.</text>
</svg>
</div>
</body>
</html>
