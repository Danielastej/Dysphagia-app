<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Správné a nesprávné polykání</title>
<style>
  /* ===== SPOLEČNÝ STYL APLIKACE – stejný ve všech modulech ===== */
  :root{
    --bg:#FBF8F3; --card:#FFFFFF; --text:#2B2735; --muted:#5C566B; --line:#E3DCEE; --focus:#5E4F99;
    /* paleta: světlá (pozadí) / pastel (kresba) / obrys / tmavá (text) */
    --lav:#E6E0F5;   --lav-p:#CDC0EC;   --lav-e:#9C89CF;   --lav-d:#5E4F99;
    --mint:#DDF0E6;  --mint-p:#A6D9BC;  --mint-e:#6DB08E;  --mint-d:#2F6B52;
    --peach:#FDE6D8; --peach-p:#F4C097; --peach-e:#D9935E; --peach-d:#9A4A22;
    --blue:#E1EEF9;  --blue-p:#B3D0EE;  --blue-e:#7FA6D1;  --blue-d:#2D5B86;
    --rose:#FBE3EC;  --rose-p:#EFAFC6;  --rose-e:#CF7C9C;  --rose-d:#9B3D62;
    --teal:#DDF1F3;  --teal-p:#A7DADF;  --teal-e:#6FB5BB;  --teal-d:#2E6E74;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.45}
  button{touch-action:manipulation;font:inherit}
  :focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  [hidden]{display:none !important}
  .wrap{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
  header h1{font-size:1.35rem;margin:4px 0 2px;color:var(--lav-d);line-height:1.25}
  header p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
  /* výběr (fáze, nervy, …) */
  .pills{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:6px;margin-bottom:10px}
  .pill{position:relative;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 2px 6px;min-height:64px;font-size:.78rem;color:var(--text);cursor:pointer;text-align:center;line-height:1.2;overflow:hidden}
  .pill b{display:block;font-size:1.25rem;color:var(--pd,var(--lav-d))}
  .pill::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--pb,var(--lav-p))}
  .pill[aria-pressed="true"],.pill[aria-current="step"]{background:var(--ps,var(--lav));border-color:var(--pe,var(--lav-e))}
  /* obrázek */
  .stage{background:var(--card);border-radius:20px;border:2px solid var(--line);padding:6px 6px 10px}
  svg{width:100%;height:auto;display:block}
  .progress{height:8px;background:var(--lav);border-radius:6px;margin:6px 6px 0;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:var(--lav-d);border-radius:6px}
  /* tlačítka */
  .controls{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:8px;margin:10px 4px 0}
  .btn{min-height:58px;border-radius:14px;border:2px solid var(--lav-d);background:var(--card);color:var(--lav-d);font-size:.95rem;font-weight:700;cursor:pointer;padding:6px 8px}
  .btn.primary{background:var(--lav-d);color:#fff}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.all{display:block;width:100%;margin:12px 0 0;background:var(--mint);border-color:var(--mint-d);color:var(--mint-d);font-size:1rem;min-height:60px}
  .btn.all.on{background:var(--mint-d);color:#fff}
  /* textový panel */
  .panel{background:var(--card);border-radius:20px;border:2px solid var(--line);padding:16px 18px;margin-top:12px}
  .panel h2{margin:0 0 6px;font-size:1.25rem;color:var(--lav-d);line-height:1.25;display:flex;align-items:center;gap:10px}
  .panel .sub{margin:-2px 0 8px;color:var(--muted);font-size:.9rem;font-style:italic}
  .chip{flex:none;min-width:40px;height:40px;padding:0 6px;border-radius:20px;border:2px solid;display:inline-grid;place-items:center;font-size:1rem;font-weight:800}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
  .badge{border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:700}
  .b-mint{background:var(--mint);color:var(--mint-d)}
  .b-peach{background:var(--peach);color:var(--peach-d)}
  .b-blue{background:var(--blue);color:var(--blue-d)}
  .b-lav{background:var(--lav);color:var(--lav-d)}
  .panel ul{padding-left:1.1em;margin:0}
  .panel li{margin-bottom:8px}
  .panel h3{font-size:1rem;margin:14px 0 6px}
  .warn{background:var(--peach);color:var(--peach-d);border-radius:12px;padding:10px 12px;font-size:.95rem;margin-top:10px}
  .row{display:flex;align-items:center;gap:12px;padding:10px 0;border:0;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;color:var(--text)}
  .row b{display:block}
  .row small{color:var(--muted);font-size:.88rem;line-height:1.3;display:block}
  /* přepínače a poznámka */
  .toggles{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-size:.95rem}
  .toggles label{display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:10px;padding:8px 4px;min-height:48px}
  .toggles input{width:28px;height:28px;accent-color:var(--lav-d);flex:none}
  .note{font-size:.82rem;color:var(--muted);margin-top:14px}
  /* ===== konec společného stylu ===== */
  /* SVG */
  .lbl rect{fill:#fff;stroke:#CFC6E3;stroke-width:1.5}
  .lbl text{font-size:17px;fill:#2B2735;font-family:inherit}
  .lbl line{stroke:#9C90BF;stroke-width:1.8}
  .air{fill:#EEF6FC}
  #airflow{fill:none;stroke:#7FB2DC;stroke-width:3;stroke-dasharray:8 9;stroke-linecap:round}
  #airflow.run{animation:flow 1.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-34}}
  #cough .cg{animation:up 1s linear infinite}
  @keyframes up{from{transform:translateY(12px)}to{transform:translateY(-12px)}}
  @media (prefers-reduced-motion:reduce){#airflow.run,#cough .cg{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Správné a nesprávné polykání</h1>
    <p>Vyberte situaci nebo stiskněte <b>Přehrát</b>.</p>
  </header>

  <nav class="pills" aria-label="Situace při polykání">
    <button class="pill" data-i="0"><b>1</b>Správně</button>
    <button class="pill" data-i="1"><b>2</b>Penetrace</button>
    <button class="pill" data-i="2"><b>3</b>Aspirace</button>
    <button class="pill" data-i="3"><b>4</b>Tichá aspirace</button>
  </nav>

    <section class="stage">
      <svg id="svg" viewBox="84 8 420 552" role="img" aria-labelledby="svgDesc">
        <desc id="svgDesc">Schematický boční řez hlavou a krkem s průchodem sousta.</desc>
        <!-- hlava -->
        <path d="M320 18 C420 18 480 80 480 170 C480 240 455 290 432 330 L428 560 L262 560 L262 452 C262 432 278 420 278 400 C278 382 266 368 248 360 C218 348 186 337 160 320 C140 306 128 292 130 274 L121 263 L127 251 L119 241 L125 230 C117 222 115 210 111 199 L95 182 C100 168 115 160 128 140 C130 80 200 18 320 18 Z" fill="#FCE7DA" stroke="#E7C3AE" stroke-width="2"/>
        <!-- páteř -->

          <rect x="392" y="315" width="36" height="44" rx="8"/><rect x="392" y="365" width="36" height="44" rx="8"/>
          <rect x="392" y="415" width="36" height="44" rx="8"/><rect x="392" y="465" width="36" height="44" rx="8"/>
          <rect x="392" y="515" width="36" height="44" rx="8"/>
        </g>
        <!-- vzduchové prostory -->
        <path class="air" d="M108 188 C140 176 160 150 200 146 C260 140 320 145 362 158 L374 165 L374 196 L300 200 C240 200 180 202 140 198 Z"/>
        <path class="air" d="M132 212 C200 204 290 203 345 214 L346 300 C300 300 200 290 134 262 Z"/>
        <path class="air" d="M334 160 L376 165 C380 260 380 340 376 434 L344 434 L342 372 L310 358 L326 330 L332 260 Z"/>

        <path id="constr" d="M378 200 L378 432 L388 432 L388 200 Z" fill="#F9DCE6" stroke="#E2A9BD" stroke-width="1.5"/>

        <path d="M134 207 C200 199 260 199 302 206" fill="none" stroke="#C9B9A3" stroke-width="9" stroke-linecap="round"/>

        <rect x="129" y="204" width="11" height="19" rx="4" fill="#fff" stroke="#CFC6B8" stroke-width="1.5"/>
        <g id="lowTeeth"><rect x="131" y="246" width="11" height="18" rx="4" fill="#fff" stroke="#CFC6B8" stroke-width="1.5"/></g>
        <!-- jazyk -->
        <path id="tongue" fill="#F3A9B9" stroke="#D97F95" stroke-width="2"/>
        <!-- hrtan (pohybuje se) -->
        <g id="larynx">

          <path d="M300 360 L292 362 C284 365 278 372 280 381 L289 428 C290 434 292 440 292 450 L346 450 L346 386 L340 378 Z" fill="#ECE6F6" stroke="#B9A9DE" stroke-width="2.5"/>
          <!-- dutina hrtanu a průdušnice -->
          <path class="air" d="M300 362 L311 356 L344 370 L338 384 L338 650 C338 664 300 664 300 650 Z"/>
          <path d="M300 364 L300 650 M338 384 L338 650" stroke="#9CC4E4" stroke-width="3" fill="none"/>
          <g stroke="#9CC4E4" stroke-width="2" fill="none">
            <path d="M300 466 h38 M300 494 h38 M300 522 h38 M300 550 h38 M300 578 h38 M300 606 h38 M300 634 h38"/>
          </g>
          <polygon id="vfL" points="300,408 300,428 309,418" fill="#E07A97" stroke="#B85573" stroke-width="1.5"/>
          <polygon id="vfR" points="338,408 338,428 329,418" fill="#E07A97" stroke="#B85573" stroke-width="1.5"/>
          <ellipse cx="284" cy="353" rx="12" ry="6" fill="#EFE7D2" stroke="#CDBE98" stroke-width="2"/>
          <g id="epi" transform="translate(300 366) rotate(-42)">
            <path d="M0 -5 C22 -7 44 -6 62 0 C44 7 22 7 0 5 Z" fill="#F7C6A3" stroke="#DE9F78" stroke-width="1.5"/>
          </g>
          <!-- valekuly a piriformní recesy: místa, kde mohou zůstat zbytky sousta (jen u poruch) [CE]
               valekuly = prohlubně mezi kořenem jazyka a přední plochou příklopky hrtanové;
               piriformní recesy = prohlubně po stranách vchodu do hrtanu, sahají dolů k hornímu jícnovému svěrači.
               Obě leží mimo střední rovinu řezu (po stranách), proto jsou naznačeny přerušovaně. -->
          <g id="pockets">
            <g fill="none" stroke="#7FA6D1" stroke-width="2" stroke-dasharray="4 3">
              <path d="M326 318 L322.5 336 C323 340 326 340 328 337 L340 322"/>
              <path d="M340 390 C337 408 341 424 350 431 C359 427 363 410 362 392"/>
            </g>
            <g id="res" opacity="0" fill="#F2B866" stroke="#D18F35" stroke-width="1.5"><path id="resV"/><path id="resP"/></g>

              <line x1="194" y1="311" x2="322" y2="331"/><rect x="96" y="296" width="98" height="30" rx="10"/><text x="145" y="317" text-anchor="middle">Valekuly</text>
              <line x1="380" y1="368" x2="356" y2="418"/><rect x="380" y="340" width="118" height="52" rx="10"/><text x="439" y="361" text-anchor="middle">Piriformní</text><text x="439" y="382" text-anchor="middle">recesy</text>
            </g>
          </g>
          <g class="lbl" data-lbl>
            <line x1="272" y1="353" x2="222" y2="349"/><rect x="132" y="334" width="90" height="30" rx="10"/><text x="177" y="355" text-anchor="middle">Jazylka</text>
            <line x1="288" y1="385" x2="222" y2="388"/><rect x="146" y="373" width="76" height="30" rx="10"/><text x="184" y="394" text-anchor="middle">Hrtan</text>
            <line x1="303" y1="418" x2="222" y2="428"/><rect x="128" y="413" width="94" height="30" rx="10"/><text x="175" y="434" text-anchor="middle">Hlasivky</text>
            <line x1="300" y1="500" x2="222" y2="492"/><rect x="108" y="477" width="114" height="30" rx="10"/><text x="165" y="498" text-anchor="middle">Průdušnice</text>
            <line x1="342" y1="325" x2="384" y2="312"/><rect x="384" y="286" width="112" height="52" rx="10"/><text x="440" y="307" text-anchor="middle">Příklopka</text><text x="440" y="328" text-anchor="middle">hrtanová</text>

        <!-- jícen -->
        <path id="eso" fill="#DCEFD6" stroke="#8CC08A" stroke-width="2.5"/>

        <g id="velum" transform="translate(300 207) rotate(48)">
          <path d="M0 -6 C25 -8 50 -6 62 2 C50 10 25 10 0 8 Z" fill="#F0B4C2" stroke="#D88A9E" stroke-width="1.5"/>
        </g>
        <!-- proud vzduchu -->
        <path id="airflow" d="M104 190 C150 178 250 166 352 176 C366 205 366 250 358 300 C350 330 332 346 320 372 L319 540"/>
        <!-- sousto -->
        <path id="bolus" fill="#F2B866" stroke="#D18F35" stroke-width="2"/>
        <path id="b2" fill="#F2B866" stroke="#D18F35" stroke-width="2" opacity="0"/>
        <g id="cough" opacity="0" fill="none" stroke="#2F6B52" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
          <g class="cg"><path d="M309 512 l10 -10 l10 10"/><path d="M309 482 l10 -10 l10 10"/><path d="M309 452 l10 -10 l10 10"/></g>
        </g>
        <text id="peri" x="356" y="400" font-size="16" fill="#2F6B52" text-anchor="middle" opacity="0">▼</text>
        <!-- popisky -->
        <g class="lbl" data-lbl>
          <rect x="190" y="154" width="128" height="28" rx="10"/><text x="254" y="174" text-anchor="middle">Nosní dutina</text>
          <line x1="178" y1="202" x2="172" y2="130"/><rect x="140" y="100" width="120" height="30" rx="10"/><text x="200" y="121" text-anchor="middle">Tvrdé patro</text>
          <line x1="328" y1="228" x2="380" y2="150"/><rect x="362" y="120" width="124" height="30" rx="10"/><text x="424" y="141" text-anchor="middle">Měkké patro</text>
          <line x1="368" y1="240" x2="390" y2="206"/><rect x="386" y="176" width="70" height="30" rx="10"/><text x="421" y="197" text-anchor="middle">Hltan</text>
          <rect x="398" y="232" width="72" height="30" rx="10"/><text x="434" y="253" text-anchor="middle">Páteř</text>
          <rect x="196" y="262" width="70" height="28" rx="10"/><text x="231" y="282" text-anchor="middle">Jazyk</text>
          <line x1="361" y1="434" x2="380" y2="432"/><rect x="380" y="410" width="118" height="52" rx="10"/><text x="439" y="431" text-anchor="middle">Horní jícnový</text><text x="439" y="452" text-anchor="middle">svěrač</text>
          <line x1="364" y1="505" x2="384" y2="505"/><rect x="384" y="491" width="70" height="30" rx="10"/><text x="419" y="512" text-anchor="middle">Jícen</text>
        </g>
        <text id="toStomach" x="372" y="548" font-size="17" fill="#2F6B52" opacity="0">↓ do žaludku</text>
      </svg>
      <div class="progress" aria-hidden="true"><i id="bar"></i></div>
      <div class="controls">
        <button class="btn" id="prev" aria-label="Předchozí fáze">◀ Zpět</button>
        <button class="btn primary" id="play">▶ Přehrát</button>
        <button class="btn" id="next" aria-label="Další fáze">Další ▶</button>
      </div>
      <button class="btn all" id="all">▶ Přehrát všechny situace</button>
    </section>

    <section class="panel" aria-live="polite">
      <h2 id="pTitle"></h2>
      <div class="badges" id="pBadges"></div>
      <ul id="pList"></ul>
      <h3 id="pSignsH">Jak to poznat</h3>
      <ul id="pSigns"></ul>
      <div class="warn" id="pWarn"></div>
    </section>

  <div class="toggles">
        <label><input type="checkbox" id="labels" checked> Zobrazit popisky</label>
        <label><input type="checkbox" id="slow"> Pomalejší přehrávání</label>
  </div>

  <p class="note">Obrázek je schematický a zjednodušený. Skutečné polknutí je mnohem rychlejší. Informace slouží ke vzdělávání a nenahrazují konzultaci s klinickým logopedem. Použité zdroje najdete v části Zdroje.</p>
</div>

         "Bublavě znějící hlas po polknutí.",                                          // [V][M][CE]

  warn:"Aspirace může vést k zápalu plic (aspirační pneumonii).",                       // [L]
  dur:11500, frames:[
   {t:0},{t:900,velum:-8,breathe:0,lx:-4,ly:-7,vf:.7,epi:-30,by:292,b2o:1,b2x:356,b2y:292},
   {t:1400,wave:1,waveY:250},{t:2000,by:350,ues:.5,eso:.2,b2x:336,b2y:345,waveY:310},{t:2900,by:410,ues:1,eso:.7,b2x:320,b2y:385,waveY:375},
   {t:3800,by:455,eso:1,b2x:319,b2y:440,risk:1,waveY:415},{t:4400,ues:0,by:470,b2y:455,wave:0},
   {t:5200,cough:1,vf:0},{t:5800,vf:1,b2y:425},{t:6600,b2x:322,b2y:372},{t:7300,b2x:348,b2y:322,risk:0,by:590},
   Object.assign({t:8100,cough:0,b2x:356,b2y:300,bo:0},DOWN),{t:8700,velum:-8,breathe:0,lx:-12,ly:-22,vf:0,epi:8,b2x:358,b2y:332,wave:1,waveY:290},{t:9400,b2y:420,ues:1,waveY:390},{t:10100,b2y:480,ues:0,wave:0},Object.assign({t:10600,b2y:540},DOWN),{t:11000,b2o:0},{t:11500}]},
 {title:"4. Tichá aspirace", badges:[["peach","Nejzávažnější riziko"],["lav","Bez kašle"]], // [L]
  list:["Sousto pronikne pod hlasivky, ale tělo se nebrání: kašel chybí."],               // [L][CE]
  signs:["Změna dýchání po polknutí, až dušení.",                                       // [L]
         "Opakované záněty dýchacích cest nebo zápal plic."],                           // [M][V]
  warn:"Aspirace může vést k zápalu plic (aspirační pneumonii).",                       // [L]
  dur:8500, frames:[
   {t:0},{t:900,velum:-8,breathe:0,lx:-4,ly:-7,vf:.7,epi:-30,by:292,b2o:1,b2x:356,b2y:292},
   {t:1400,wave:1,waveY:250},{t:2000,by:350,ues:.5,eso:.2,b2x:336,b2y:345,waveY:310},{t:2900,by:410,ues:1,eso:.7,b2x:320,b2y:385,waveY:375},

   {t:5000,silent:1,b2y:490},Object.assign({t:6200,b2y:540,by:590},DOWN),{t:6700,bo:0},{t:8500}]}
];

// full states, carried across phases
PHASES.forEach(p=>{let carry=Object.assign({},BASE);p.frames=p.frames.map(f=>{carry=Object.assign({},carry,f);return carry;});});

const $=id=>document.getElementById(id);
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function mixState(a,b,k){const o={};for(const key in a){const va=a[key],vb=b[key];o[key]=Array.isArray(va)?va.map((v,i)=>lerp(v,vb[i],k)):lerp(va,vb,k);}return o;}
function stateAt(p,t){const f=p.frames;if(t<=0)return f[0];for(let i=1;i<f.length;i++){if(t<=f[i].t){const k=ease((t-f[i-1].t)/((f[i].t-f[i-1].t)||1));return mixState(f[i-1],f[i],k);}}return f[f.length-1];}

const tongueEl=$('tongue'),velum=$('velum'),epi=$('epi'),lar=$('larynx'),bolus=$('bolus'),eso=$('eso'),air=$('airflow'),teeth=$('lowTeeth');
function tonguePath(a){const n=a.map(v=>v.toFixed(1));return `M${n[0]} ${n[1]} C${n[2]} ${n[3]} ${n[4]} ${n[5]} ${n[6]} ${n[7]} C${n[8]} ${n[9]} ${n[10]} ${n[11]} ${n[12]} ${n[13]} C${n[14]} ${n[15]} ${n[16]} ${n[17]} ${n[18]} ${n[19]} C${n[20]} ${n[21]} ${n[22]} ${n[23]} ${n[24]} ${n[25]} L300 348 L210 302 C175 292 150 278 140 262 Z`;}
function esoPath(s){const cx=358,top=432,bot=600,L=[],R=[];
  const k2=Math.min(1,Math.max(0,(s.b2y-422)/16))*s.b2o;
  for(let y=top;y<=bot;y+=6){let hw=3+11*Math.exp(-Math.pow((y-s.by)/20,2))*s.eso*s.bo+7*Math.exp(-Math.pow((y-s.b2y)/16,2))*k2;
    if(y<top+18)hw+=7*s.ues;
    if(s.peri>.01&&y>s.by-48&&y<s.by-20)hw=Math.min(hw,1.6+1.4*(1-s.peri));
    L.push([cx-hw,y]);R.push([cx+hw,y]);}
  return 'M'+L.map(p=>p[0].toFixed(1)+' '+p[1]).join(' L')+' L'+R.reverse().map(p=>p[0].toFixed(1)+' '+p[1]).join(' L')+' Z';}
// nepravidelný tvar sousta
const BL=[1,.8,1.12,.86,1.18,.82,1.06,.9,1.15,.84];
function blob(cx,cy,rx,ry,ph=0){const n=BL.length,p=[];for(let i=0;i<n;i++){const a=i/n*2*Math.PI,k=BL[i]*(1+.08*Math.sin(ph+i*1.7));p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k]);}
  const f=v=>v.toFixed(1);let d=`M${f(p[0][0])} ${f(p[0][1])}`;
  for(let i=0;i<n;i++){const p0=p[(i+n-1)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];
    d+=` C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`;}
  return d+' Z';}
// stah svalů zadní stěny hltanu
function constrPath(s){let d='M388 200';for(let y=200;y<=432;y+=6){const x=378-14*s.wave*Math.exp(-Math.pow((y-s.waveY)/13,2));d+=` L${x.toFixed(1)} ${y}`;}return d+' L388 432 Z';}
const hex=(c1,c2,k)=>{const a=c1.match(/\w\w/g).map(h=>parseInt(h,16)),b=c2.match(/\w\w/g).map(h=>parseInt(h,16));return '#'+a.map((v,i)=>Math.round(lerp(v,b[i],k)).toString(16).padStart(2,'0')).join('');};

function render(s,now){
  const chewPh=s.chew>0.01?(0.5-0.5*Math.cos(now/700*2*Math.PI)):0;
  tongueEl.setAttribute('d',tonguePath(s.tongue));
  velum.setAttribute('transform',`translate(300 207) rotate(${s.velum.toFixed(1)})`);
  lar.setAttribute('transform',`translate(${s.lx.toFixed(1)} ${s.ly.toFixed(1)})`);
  epi.setAttribute('transform',`translate(300 366) rotate(${s.epi.toFixed(1)})`);
  const w=9+10*(1-s.vf);
  $('vfL').setAttribute('points',`300,408 300,428 ${300+w},418`);
  $('vfR').setAttribute('points',`338,408 338,428 ${338-w},418`);
  $('constr').setAttribute('d',constrPath(s));
  teeth.setAttribute('transform',`translate(0 ${(s.chew*7*chewPh).toFixed(1)})`);
  eso.setAttribute('d',esoPath(s));
  const wob=s.chew*Math.sin(now/350);
  const inEso=s.by>430&&s.by<712?Math.min(1,(s.by-430)/30):0;
  bolus.setAttribute('d',blob(s.bx+wob*3,s.by,13-3*inEso+wob*2,13+4*inEso-wob*2,now/300));
  bolus.setAttribute('opacity',s.bo.toFixed(2));
  bolus.setAttribute('fill',hex('D9965A','F4C67E',s.mix));
  air.setAttribute('opacity',(0.12+0.88*s.breathe).toFixed(2));
  air.classList.toggle('run',s.breathe>0.5);
  $('peri').setAttribute('y',(s.by-26).toFixed(1));$('peri').setAttribute('opacity',(s.peri*s.bo).toFixed(2));
  $('toStomach').setAttribute('opacity',s.stom.toFixed(2));
  $('b2').setAttribute('d',blob(s.b2x,s.b2y,8,7.5,now/300+2));$('b2').setAttribute('opacity',s.b2o.toFixed(2));$('res').setAttribute('opacity',s.res.toFixed(2));
  $('cough').setAttribute('opacity',s.cough.toFixed(2));$('risk').setAttribute('opacity',s.risk.toFixed(2));
}

let cur=0,t=0,playing=false,chain=false,last=0;
const factor=()=>($('slow').checked?1.7:1)*(chain?0.65:1);
function showPhase(i){
  cur=i;t=0;const p=PHASES[i];
  $('pTitle').textContent=p.title;
  $('pBadges').innerHTML=p.badges.map(b=>`<span class="badge b-${b[0]}">${b[1]}</span>`).join('');
  $('pList').innerHTML=p.list.map(x=>`<li>${x}</li>`).join('');
  $('pSigns').innerHTML=p.signs.map(x=>`<li>${x}</li>`).join('');$('pSignsH').hidden=$('pSigns').hidden=!p.signs.length;
  $('pWarn').innerHTML='<b>Pozor:</b> '+p.warn;$('pWarn').hidden=!p.warn;
  $('pockets').style.display=i>0?'':'none';
  document.querySelectorAll('.pill').forEach((el,k)=>{if(k===i)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');});
  $('prev').disabled=i===0;$('next').disabled=i===PHASES.length-1;
  $('svg').setAttribute('aria-label','Animace: '+p.title);
  render(stateAt(p,0),performance.now());$('bar').style.width='0%';
}
function setPlayBtn(){$('all').classList.toggle('on',chain&&playing);$('play').textContent=playing?'❚❚ Pauza':(t>=PHASES[cur].dur*factor()?'↺ Znovu':'▶ Přehrát');}
function loop(now){
  if(!playing)return;
  t+=Math.min(now-last,60);last=now;
  const p=PHASES[cur],D=p.dur*factor();
  if(t>=D){t=D;render(stateAt(p,p.dur),now);$('bar').style.width='100%';
    if(chain&&cur<PHASES.length-1){showPhase(cur+1);}else{playing=false;chain=false;t=PHASES[cur].dur*factor();setPlayBtn();return;}}
  else{render(stateAt(p,t/factor()),now);$('bar').style.width=(100*t/D)+'%';}
  requestAnimationFrame(loop);
}
function play(){if(t>=PHASES[cur].dur*factor())t=0;playing=true;last=performance.now();setPlayBtn();requestAnimationFrame(loop);}
function pause(){playing=false;chain=false;setPlayBtn();}

$('play').onclick=()=>playing?pause():play();
$('prev').onclick=()=>{pause();showPhase(cur-1);play();};
$('next').onclick=()=>{pause();showPhase(cur+1);play();};
$('all').onclick=()=>{pause();showPhase(0);chain=true;play();};
document.querySelectorAll('.pill').forEach(el=>el.onclick=()=>{pause();showPhase(+el.dataset.i);play();});
$('labels').onchange=e=>document.querySelectorAll('[data-lbl]').forEach(g=>g.style.display=e.target.checked?'':'none');
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'&&cur<3)$('next').click();if(e.key==='ArrowLeft'&&cur>0)$('prev').click();});
let sx=null;$('svg').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
$('svg').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;
  if(dx<-60&&cur<3)$('next').click();else if(dx>60&&cur>0)$('prev').click();});
$('resV').setAttribute('d',blob(327,332,4.5,5.5));$('resP').setAttribute('d',blob(350,422,6,6));
showPhase(0);setPlayBtn();
// pro testování: ?phase=3&t=2000
const q=new URLSearchParams(location.search);if(q.has('phase')){showPhase(+q.get('phase'));const p=PHASES[cur];t=+q.get('t')||0;render(stateAt(p,t),0);}
})();
</script>
