<text class="ts" x="255" y="235" text-anchor="middle" dominant-baseline="central" fill="#7A7360">V</text>
<circle cx="308" cy="225" r="10" fill="#EDD4DE" stroke="#C99AB0" stroke-width="0.5"/>
<text class="ts" x="308" y="225" text-anchor="middle" dominant-baseline="central" fill="#9C6B82">VII</text>
<circle cx="255" cy="270" r="10" fill="#F5C4AC" stroke="#E8A583" stroke-width="0.5"/>
<text class="ts" x="255" y="270" text-anchor="middle" dominant-baseline="central" fill="#B06A42">XII</text>
<circle cx="255" cy="165" r="10" fill="#C4DDCC" stroke="#9CC2A8" stroke-width="0.5"/>
<text class="ts" x="255" y="165" text-anchor="middle" dominant-baseline="central" fill="#4A7A5A">XI</text>
<circle cx="222" cy="335" r="10" fill="#F5D9A0" stroke="#E0BD78" stroke-width="0.5"/>
<text class="ts" x="222" y="335" text-anchor="middle" dominant-baseline="central" fill="#A67A2E">IX</text>
<circle cx="191" cy="450" r="10" fill="#B8D4EE" stroke="#8FB8DE" stroke-width="0.5"/>
<text class="ts" x="191" y="450" text-anchor="middle" dominant-baseline="central" fill="#2E6B9C">X</text>
<line class="leader" x1="298" y1="140" x2="480" y2="75"/>
<text class="th" x="486" y="71" style="fill:#5A9AC8">Nosní dutina</text>
<text class="ts" x="486" y="89" style="fill:#86B8DE">uzavře se měkkým patrem</text>
<line class="leader" x1="270" y1="152" x2="480" y2="134"/>
<text class="th" x="486" y="130" style="fill:#6FA080">Měkké patro</text>
<text class="ts" x="486" y="148" style="fill:#8CBC9C">uzavírá vstup do nosu</text>
<line class="leader" x1="280" y1="300" x2="480" y2="190"/>
<text class="th" x="486" y="186" style="fill:#E29A76">Jazyk</text>
<text class="ts" x="486" y="204" style="fill:#EDB79C">hřbet s rýhou, kořen tlačí sousto dozadu</text>
<line class="leader" x1="232" y1="350" x2="480" y2="246"/>
<text class="th" x="486" y="242" style="fill:#D4A94E">Hltan</text>
<text class="ts" x="486" y="260" style="fill:#E6C377">stěna se stahuje a posouvá sousto</text>
<line class="leader" x1="222" y1="400" x2="480" y2="302"/>
<text class="th" x="486" y="298" style="fill:#D689AE">Epiglottis</text>
<text class="ts" x="486" y="316" style="fill:#E3A8C6">hrtanová příklopka, chrání dýchací cesty</text>
<line class="leader" x1="221" y1="356" x2="480" y2="358"/>
<text class="th" x="486" y="354" style="fill:#BDAE7C">Jazylka</text>
<text class="ts" x="486" y="372" style="fill:#D2C59C">kost, na které je zavěšen kořen jazyka</text>
<line class="leader" x1="211" y1="460" x2="480" y2="414"/>
<text class="th" x="486" y="410" style="fill:#5C93C2">Hrtan a průdušnice</text>
<text class="ts" x="486" y="428" style="fill:#82B2D8">dýchací cesty, při polykání se uzavřou</text>
<line class="leader" x1="236" y1="470" x2="480" y2="470"/>
<text class="th" x="486" y="466" style="fill:#9A83C4">Jícen</text>
<text class="ts" x="486" y="484" style="fill:#B7A6D8">vede sousto do žaludku</text>
<text class="th" x="40" y="580">Nervy zapojené do polykání</text>
<rect x="40" y="610" width="600" height="92" rx="10" fill="#E8E4D8" opacity="0.2"/>
<rect x="40" y="610" width="6" height="92" rx="3" fill="#C4BCA8"/>
<text class="th" x="64" y="630" style="fill:#8A8270">V. n. trigeminus (trojklanný nerv)</text>
<text class="ts" x="64" y="648" style="fill:#B5AD9C">Zajišťuje citlivost v celé dutině ústní i na obličeji, takže vnímáme teplotu, dotek</text>
<text class="ts" x="64" y="664" style="fill:#B5AD9C">a polohu sousta v ústech. Zároveň ovládá žvýkací svaly, kterými sousto</text>
<text class="ts" x="64" y="680" style="fill:#B5AD9C">rozmělňujeme a připravujeme na polknutí.</text>
<rect x="40" y="716" width="600" height="76" rx="10" fill="#EDD4DE" opacity="0.2"/>
<rect x="40" y="716" width="6" height="76" rx="3" fill="#C99AB0"/>
<text class="th" x="64" y="736" style="fill:#B5859C">VII. n. facialis (lícní nerv)</text>
<text class="ts" x="64" y="754" style="fill:#D4B0C2">Řídí mimické svaly obličeje, díky nimž dokážeme pevně sevřít rty. To je důležité, aby</text>
<text class="ts" x="64" y="770" style="fill:#D4B0C2">nám při žvýkání a polykání sousto nebo tekutina neunikaly z úst ven.</text>
<rect x="40" y="806" width="600" height="92" rx="10" fill="#F5D9A0" opacity="0.2"/>
<rect x="40" y="806" width="6" height="92" rx="3" fill="#E0BD78"/>
<text class="th" x="64" y="826" style="fill:#D9B36B">IX. n. glossopharyngeus (jazykohltanový nerv)</text>
<text class="ts" x="64" y="844" style="fill:#EACB93">Vnímá citlivost na zadní třetině jazyka a v hltanu. Jakmile sousto tuto oblast</text>
<text class="ts" x="64" y="860" style="fill:#EACB93">podráždí, je to právě tento nerv, který dá signál ke spuštění samotného</text>
<text class="ts" x="64" y="876" style="fill:#EACB93">polykacího reflexu.</text>
<rect x="40" y="912" width="600" height="92" rx="10" fill="#B8D4EE" opacity="0.2"/>
<rect x="40" y="912" width="6" height="92" rx="3" fill="#8FB8DE"/>
<text class="th" x="64" y="932" style="fill:#5C93C2">X. n. vagus (bloudivý nerv)</text>
<text class="ts" x="64" y="950" style="fill:#82B2D8">Je nejdelší z hlavových nervů. Uzavírá hrtan, aby sousto nevniklo do dýchacích cest</text>
<text class="ts" x="64" y="966" style="fill:#82B2D8">a zároveň svými vlákny zajišťuje vlnovité stahy (peristaltiku) hltanu i jícnu,</text>
<text class="ts" x="64" y="982" style="fill:#82B2D8">jež posouvají sousto dál k žaludku.</text>
<rect x="40" y="1018" width="600" height="76" rx="10" fill="#C4DDCC" opacity="0.2"/>
<rect x="40" y="1018" width="6" height="76" rx="3" fill="#9CC2A8"/>
<text class="th" x="64" y="1038" style="fill:#6FA080">XI. n. accessorius (přídatný nerv)</text>
<text class="ts" x="64" y="1056" style="fill:#8CBC9C">Podílí se na zvednutí měkkého patra, které uzavírá vstup do nosu, a zároveň</text>
<text class="ts" x="64" y="1072" style="fill:#8CBC9C">pomáhá stahovat svaly stěny hltanu, čímž posouvá sousto směrem k jícnu.</text>
<rect x="40" y="1108" width="600" height="76" rx="10" fill="#F5C4AC" opacity="0.2"/>
<rect x="40" y="1108" width="6" height="76" rx="3" fill="#E8A583"/>
<text class="th" x="64" y="1128" style="fill:#E29A76">XII. n. hypoglossus (podjazykový nerv)</text>
<text class="ts" x="64" y="1146" style="fill:#EDB79C">Ovládá téměř všechny pohyby jazyka — jeho tvarování při žvýkání i to, jak</text>
<text class="ts" x="64" y="1162" style="fill:#EDB79C">jazyk tlačí sousto dozadu, aby mohlo být polknuto.</text>
</svg>
