<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nervy a polykání</title>
<style>
  /* ===== SPOLEČNÝ STYL APLIKACE – stejný ve všech modulech ===== */
  :root{
    --bg:#FBF8F3; --card:#FFFFFF; --text:#2B2735; --muted:#5C566B; --line:#E3DCEE; --focus:#5E4F99;
    /* paleta: světlá (pozadí) / pastel (kresba) / obrys / tmavá (text) */
    --lav:#E6E0F5;   --lav-p:#CDC0EC;   --lav-e:#9C89CF;   --lav-d:#5E4F99;
    --mint:#DDF0E6;  --mint-p:#A6D9BC;  --mint-e:#6DB08E;  --mint-d:#2F6B52;
    --peach:#FDE6D8; --peach-p:#F4C097; --peach-e:#D9935E; --peach-d:#9A4A22;
    --blue:#E1EEF9;  --blue-p:#B3D0EE;  --blue-e:#7FA6D1;  --blue-d:#2D5B86;
    --rose:#FBE3EC;  --rose-p:#EFAFC6;  --rose-e:#CF7C9C;  --rose-d:#9B3D62;
    --teal:#DDF1F3;  --teal-p:#A7DADF;  --teal-e:#6FB5BB;  --teal-d:#2E6E74;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.45}
  button{touch-action:manipulation;font:inherit}
  :focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  [hidden]{display:none !important}
  .wrap{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
  header h1{font-size:1.35rem;margin:4px 0 2px;color:var(--lav-d);line-height:1.25}
  header p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
  /* výběr (fáze, nervy, …) */
  .pills{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:6px;margin-bottom:10px}
  .pill{position:relative;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 2px 6px;min-height:64px;font-size:.78rem;color:var(--text);cursor:pointer;text-align:center;line-height:1.2;overflow:hidden}
  .pill b{display:block;font-size:1.25rem;color:var(--pd,var(--lav-d))}
  .pill::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--pb,var(--lav-p))}
  .pill[aria-pressed="true"],.pill[aria-current="step"]{background:var(--ps,var(--lav));border-color:var(--pe,var(--lav-e))}
  /* obrázek */
  .stage{background:var(--card);border-radius:20px;border:2px solid var(--line);padding:6px 6px 10px}
  svg{width:100%;height:auto;display:block}
  .progress{height:8px;background:var(--lav);border-radius:6px;margin:6px 6px 0;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:var(--lav-d);border-radius:6px}
  /* tlačítka */
  .controls{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:8px;margin:10px 4px 0}
  .btn{min-height:58px;border-radius:14px;border:2px solid var(--lav-d);background:var(--card);color:var(--lav-d);font-size:.95rem;font-weight:700;cursor:pointer;padding:6px 8px}
  .btn.primary{background:var(--lav-d);color:#fff}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.all{display:block;width:100%;margin:12px 0 0;background:var(--mint);border-color:var(--mint-d);color:var(--mint-d);font-size:1rem;min-height:60px}
  .btn.all.on{background:var(--mint-d);color:#fff}
  /* textový panel */
  .panel{background:var(--card);border-radius:20px;border:2px solid var(--line);padding:16px 18px;margin-top:12px}
  .panel h2{margin:0 0 6px;font-size:1.25rem;color:var(--lav-d);line-height:1.25;display:flex;align-items:center;gap:10px}
  .panel .sub{margin:-2px 0 8px;color:var(--muted);font-size:.9rem;font-style:italic}
  .chip{flex:none;min-width:40px;height:40px;padding:0 6px;border-radius:20px;border:2px solid;display:inline-grid;place-items:center;font-size:1rem;font-weight:800}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
  .badge{border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:700}
  .b-mint{background:var(--mint);color:var(--mint-d)}
  .b-peach{background:var(--peach);color:var(--peach-d)}
  .b-blue{background:var(--blue);color:var(--blue-d)}
  .b-lav{background:var(--lav);color:var(--lav-d)}
  .panel ul{padding-left:1.1em;margin:0}
  .panel li{margin-bottom:8px}
  .panel h3{font-size:1rem;margin:14px 0 6px}
  .warn{background:var(--peach);color:var(--peach-d);border-radius:12px;padding:10px 12px;font-size:.95rem;margin-top:10px}
  .row{display:flex;align-items:center;gap:12px;padding:10px 0;border:0;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;color:var(--text)}
  .row b{display:block}
  .row small{color:var(--muted);font-size:.88rem;line-height:1.3;display:block}
  /* přepínače a poznámka */
  .toggles{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-size:.95rem}
  .toggles label{display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:10px;padding:8px 4px;min-height:48px}
  .toggles input{width:28px;height:28px;accent-color:var(--lav-d);flex:none}
  .note{font-size:.82rem;color:var(--muted);margin-top:14px}
  /* ===== konec společného stylu ===== */
  /* SVG */
  .air{fill:#EEF6FC}
  .lbl rect{fill:#fff;stroke-width:2}
  .lbl text{font-size:17px;fill:#2B2735;font-family:inherit}
  .nerve{display:none}
  .nerve.on{display:inline}
  .main{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .on .main{stroke-dasharray:1;animation:draw 1.2s ease-out both}
  .sig{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:.015 .07;opacity:0}
  .on .sig{animation:flow 1.4s linear infinite,show .3s 1.2s forwards}
  .trg{opacity:0}
  .on .trg{animation:show .5s 1s forwards}
  .on .lbl{opacity:0;animation:show .5s 1.1s forwards}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes flow{from{stroke-dashoffset:.085}to{stroke-dashoffset:0}}
  @keyframes show{to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.on .main,.on .sig,.on .trg,.on .lbl{animation:none;opacity:1}}
  .hideLabels .lbl{display:none}
  .toggles label{display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:10px;padding:8px 4px;min-height:48px;font-size:.95rem;margin-top:8px}
  .toggles input{width:28px;height:28px;accent-color:var(--lav-d);flex:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Nervy a polykání</h1>
    <p>Vyberte nerv a uvidíte, kam vede a co při polykání ovládá.</p>
  </header>

  <nav class="pills" id="pills" style="--cols:3" aria-label="Hlavové nervy"></nav>

  <div id="detail">
    <section class="stage">
      <svg id="svg" viewBox="84 8 420 552" role="img" aria-labelledby="svgDesc">
        <desc id="svgDesc">Schematický boční řez hlavou a krkem s mozkovým kmenem a vybraným hlavovým nervem.</desc>
        <path d="M320 18 C420 18 480 80 480 170 C480 240 455 290 432 330 L428 560 L262 560 L262 452 C262 432 278 420 278 400 C278 382 266 368 248 360 C218 348 186 337 160 320 C140 306 128 292 130 274 L121 263 L127 251 L119 241 L125 230 C117 222 115 210 111 199 L95 182 C100 168 115 160 128 140 C130 80 200 18 320 18 Z" fill="#FCE7DA" stroke="#E7C3AE" stroke-width="2"/>
        <!-- mozek -->
        <path d="M136 138 C124 70 204 25 314 25 C418 25 474 76 474 138 C474 152 470 160 462 164 C446 150 426 138 404 134 C392 132 384 132 378 134 C350 140 320 138 296 138 C250 138 190 144 136 138 Z" fill="#EFEAF9" stroke="#CDC0EC" stroke-width="2"/>
        <g fill="none" stroke="#D9CFF0" stroke-width="2.5" stroke-linecap="round">
          <path d="M172 72 C190 84 186 100 204 110"/><path d="M226 44 C222 66 240 78 232 100"/>
          <path d="M300 30 C290 58 308 80 296 108"/><path d="M362 40 C350 64 372 84 360 108"/>
          <path d="M424 66 C410 86 432 102 420 124"/><path d="M188 126 C236 112 300 112 352 124"/>
        </g>

        <path id="stem" d="M380 130 C400 124 424 130 428 146 C432 170 430 194 428 214 L396 214 C394 190 388 160 380 130 Z" fill="#D9CFF0" stroke="#B9A9DE" stroke-width="2"/>
        <g fill="#ECE6F6" stroke="#D5CCE8" stroke-width="1.5">
          <rect x="392" y="217" width="36" height="44" rx="8"/><rect x="392" y="265" width="36" height="44" rx="8"/>
          <rect x="392" y="315" width="36" height="44" rx="8"/><rect x="392" y="365" width="36" height="44" rx="8"/>
          <rect x="392" y="415" width="36" height="44" rx="8"/><rect x="392" y="465" width="36" height="44" rx="8"/>
          <rect x="392" y="515" width="36" height="44" rx="8"/>
        </g>
        <path class="air" d="M108 188 C140 176 160 150 200 146 C260 140 320 145 362 158 L374 165 L374 196 L300 200 C240 200 180 202 140 198 Z"/>
        <path class="air" d="M132 212 C200 204 290 203 345 214 L346 300 C300 300 200 290 134 262 Z"/>
        <path class="air" d="M334 160 L376 165 C380 260 380 340 376 434 L344 434 L342 372 L310 358 L326 330 L332 260 Z"/>
        <path d="M378 200 L378 432 L388 432 L388 200 Z" fill="#F9DCE6" stroke="#E2A9BD" stroke-width="1.5"/>
        <path d="M134 207 C200 199 260 199 302 206" fill="none" stroke="#C9B9A3" stroke-width="9" stroke-linecap="round"/>
        <rect x="129" y="204" width="11" height="19" rx="4" fill="#fff" stroke="#CFC6B8" stroke-width="1.5"/>
        <rect x="131" y="246" width="11" height="18" rx="4" fill="#fff" stroke="#CFC6B8" stroke-width="1.5"/>
        <path d="M140 262 C138 250 150 238 172 236 C210 232 250 228 285 232 C315 236 332 255 330 285 C330 305 326 322 322 338 L300 348 L210 302 C175 292 150 278 140 262 Z" fill="#F3A9B9" stroke="#D97F95" stroke-width="2"/>
        <!-- hrtan: zjednodušená stěna hrtanu (vpředu ohryzek) -->

        <!-- hrtan a průdušnice -->
        <path class="air" d="M300 362 L311 356 L344 370 L338 384 L338 650 C338 664 300 664 300 650 Z"/>
        <path d="M300 364 L300 650 M338 384 L338 650" stroke="#9CC4E4" stroke-width="3" fill="none"/>
        <path d="M300 466 h38 M300 494 h38 M300 522 h38 M300 550 h38" stroke="#9CC4E4" stroke-width="2"/>
        <polygon points="300,408 300,428 309,418" fill="#E07A97" stroke="#B85573" stroke-width="1.5"/>
        <polygon points="338,408 338,428 329,418" fill="#E07A97" stroke="#B85573" stroke-width="1.5"/>
        <ellipse cx="284" cy="353" rx="12" ry="6" fill="#EFE7D2" stroke="#CDBE98" stroke-width="2"/>
        <g transform="translate(300 366) rotate(-42)"><path d="M0 -5 C22 -7 44 -6 62 0 C44 7 22 7 0 5 Z" fill="#F7C6A3" stroke="#DE9F78" stroke-width="1.5"/></g>
        <path d="M355 432 L361 432 L361 560 L355 560 Z" fill="#DCEFD6" stroke="#8CC08A" stroke-width="2.5"/>
        <g transform="translate(300 207) rotate(48)"><path d="M0 -6 C25 -8 50 -6 62 2 C50 10 25 10 0 8 Z" fill="#F0B4C2" stroke="#D88A9E" stroke-width="1.5"/></g>
        <g id="nerves"></g>
        <g class="lbl" id="stemLbl">
          <line x1="408" y1="150" x2="392" y2="80" stroke="#9C90BF" stroke-width="1.8"/>
          <rect x="318" y="52" width="148" height="30" rx="10" stroke="#B9A9DE"/><text x="392" y="73" text-anchor="middle">Mozkový kmen</text>
        </g>
      </svg>
      <div class="controls">
        <button class="btn" id="prev">◀ Zpět</button>
        <button class="btn primary" id="play">▶ Přehrát</button>

      <button class="btn all" id="all">Přehled všech nervů</button>
    </section>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>

  <div class="toggles"><label><input type="checkbox" id="labels" checked> Zobrazit popisky</label></div>

  <p class="note">Obrázek je schematický a zjednodušený, nervy jsou zakresleny jen přibližně. Informace slouží ke vzdělávání a nenahrazují konzultaci s klinickým logopedem nebo lékařem. Použité zdroje najdete v části Zdroje.</p>
</div>

<script>
(function(){
// lbl: [x, y, šířka, text, cílX, cílY]
// Zdroje: [L] Lasotová a kol. 2024; [SP] Panara a kol.: Physiology, Swallowing (StatPearls 2023);
// [SP5] Daly: Neuroanatomy, Cranial Nerve 5; [SP7] Naqvi: Neuroanatomy, Cranial Nerve 7; [SP11] Varacallo: Neuroanatomy, Cranial Nerve 11 (StatPearls);
// [K] Kachlík: Hlavové nervy 2. díl (Ústav anatomie 2. LF UK)
const N=[
 {id:'V',col:'peach',name:'trojklanný',title:'Trojklanný nerv',latin:'nervus trigeminus',type:'Smíšený nerv – pohyb i citlivost',
  short:'Žvýkací svaly a sval spodiny úst.',
  paths:['M386 150 C340 150 300 165 272 185','M272 185 C270 236 258 286 238 314','M272 185 C270 225 264 260 256 296'],
  trg:[[238,318,40,10],[256,298,26,16]],
  lbl:[[96,382,140,'Spodina úst',224,320],[96,432,156,'Žvýkací svaly',256,304]],
  does:['Ovládá žvýkací svaly.','Ovládá sval spodiny úst a napínač měkkého patra.']},
 {id:'VII',col:'rose',name:'lícní',title:'Lícní nerv',latin:'nervus facialis',type:'Smíšený nerv – pohyb i citlivost',
  short:'Mimické svaly, chuť, sliny.',
  paths:['M388 163 C340 176 300 200 268 228','M268 228 C228 246 180 256 140 250','M268 228 C252 232 232 236 212 240'],
  trg:[[136,250,15,22],[208,242,26,12]],
  lbl:[[96,382,160,'Svaly obličeje',136,270],[96,94,214,'Chuť a sliny',208,236]],
  does:['Ovládá mimické svaly obličeje a sval tváře.','Přenáší chuť z předních dvou třetin jazyka.','Řídí podčelistní a podjazykovou slinnou žlázu.']},
 {id:'IX',col:'mint',name:'jazykohltanový',title:'Jazykohltanový nerv',latin:'nervus glossopharyngeus',type:'Smíšený nerv – pohyb i citlivost',
  short:'Chuť a citlivost zadní části jazyka a hltanu.',
  paths:['M390 176 C372 200 352 226 336 254','M336 254 C326 262 316 266 304 270','M336 254 C348 260 360 266 368 278'],
  trg:[[304,268,24,15],[360,284,14,26]],
  lbl:[[96,94,206,'Zadní část jazyka',300,262],[96,382,100,'Hltan',356,300]],
  does:['Přenáší chuť ze zadní třetiny jazyka.','Přenáší citlivost z hltanu.','Spolu s nervy X a XI se podílí na zahájení hltanové fáze polykání.','Řídí příušní slinnou žlázu.']},
 {id:'X',col:'blue',name:'bloudivý',title:'Bloudivý nerv',latin:'nervus vagus',type:'Smíšený nerv – pohyb i citlivost',
  short:'Měkké patro, hltan a hrtan.',
  paths:['M392 188 C386 230 380 280 378 330 C376 360 372 380 368 396','M386 214 C366 216 346 220 326 228','M377 372 C356 380 338 392 322 402'],
  trg:[[322,232,16,20],[358,350,15,60],[319,410,24,26]],
  lbl:[[96,94,160,'Měkké patro',318,226],[96,382,180,'Hrtan a hlasivky',296,412],[96,286,156,'Svaly hltanu',350,330]],
  does:['Ovládá svaly měkkého patra, které uzavírá cestu do nosu.','Ovládá svaly hltanu, které posouvají sousto dolů.','Ovládá svaly hrtanu, které zavírají hlasivky.']},
 {id:'XI',col:'lav',name:'přídatný',title:'Přídatný nerv',latin:'nervus accessorius',type:'Pohybový nerv',
  short:'Kývač hlavy a trapézový sval.',
  paths:['M395 202 C418 214 436 228 446 244','M446 244 C400 330 330 450 280 546'],
  trg:[],band:'M446 244 C400 330 330 450 280 546',
  lbl:[[96,432,176,'Svaly krku',318,480]],
  does:['Ovládá kývač hlavy a trapézový sval.','Část jeho vláken se připojuje k bloudivému nervu.','Mezi nervy polykání ho uvádějí jen někteří autoři: podle nich se spolu s nervy IX a X podílí na zahájení hltanové fáze.']},
 {id:'XII',col:'teal',name:'podjazykový',title:'Podjazykový nerv',latin:'nervus hypoglossus',type:'Pohybový nerv',
  short:'Svaly jazyka.',
  paths:['M394 198 C370 240 340 296 300 318 C280 326 262 318 246 300','M246 300 C234 290 224 280 214 268'],
  trg:[[236,266,64,22]],
  lbl:[[96,94,150,'Svaly jazyka',224,256]],
  does:['Ovládá svaly jazyka.','Jazyk zvedá sousto a posouvá ho dozadu do hltanu.']}
];
const T=getComputedStyle(document.documentElement);
N.forEach(n=>{const v=x=>T.getPropertyValue('--'+n.col+x).trim();n.soft=v('');n.p=v('-p');n.m=v('-e');n.c=v('-d');});
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const el=(tag,at,par)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);par&&par.appendChild(e);return e;};
N.forEach(n=>{
  const g=el('g',{class:'nerve'},$('nerves'));
  if(n.band)el('path',{class:'trg',d:n.band,stroke:n.p,'stroke-opacity':.6,'stroke-width':24,fill:'none','stroke-linecap':'round'},g);
  n.trg.forEach(t=>el('ellipse',{class:'trg',cx:t[0],cy:t[1],rx:t[2],ry:t[3],fill:n.p,'fill-opacity':.6,stroke:n.m,'stroke-width':2}, g));
  n.paths.forEach(d=>el('path',{class:'main',d,stroke:n.m,'stroke-width':9.5,pathLength:1},g));n.paths.forEach(d=>{el('path',{class:'main',d,stroke:n.p,pathLength:1},g);el('path',{class:'sig',d,stroke:n.m,pathLength:1},g);});
  n.lbl.forEach(([x,y,w,txt,tx,ty])=>{const lg=el('g',{class:'lbl'},g);
    el('line',{x1:x+w,y1:y+15,x2:tx,y2:ty,stroke:n.m,'stroke-width':1.8},lg);
    el('rect',{x,y,width:w,height:30,rx:10,stroke:n.m},lg);
    const t=el('text',{x:x+w/2,y:y+21,'text-anchor':'middle'},lg);t.textContent=txt;});
});
const groups=[...$('nerves').children];
N.forEach((n,i)=>{const b=document.createElement('button');b.className='pill';b.style.setProperty('--pd',n.c);b.style.setProperty('--pb',n.p);b.style.setProperty('--pe',n.m);b.style.setProperty('--ps',n.soft);
  b.innerHTML=`<b>${n.id}</b>${n.name}`;b.onclick=()=>select(i);$('pills').appendChild(b);});
let cur=0,ovMode=false;
function select(i){
  cur=i;const n=N[i];
  ovMode=false;$('all').classList.remove('on');$('all').textContent='Přehled všech nervů';
  document.querySelectorAll('.pill').forEach((p,k)=>p.setAttribute('aria-pressed',k===i?'true':'false'));
  groups.forEach((g,k)=>{g.classList.remove('on');if(k===i){void g.getBoundingClientRect();g.classList.add('on');}});
  $('stem').setAttribute('fill',n.p);$('stem').setAttribute('stroke',n.m);
  $('prev').disabled=i===0;$('next').disabled=i===N.length-1;
  $('panel').innerHTML=`<h2><span class="chip" style="background:${n.p};border-color:${n.m};color:${n.c}">${n.id}</span>${n.title}</h2><p class="sub">${n.latin}</p><div class="badges"><span class="badge ${n.col&&n.type.startsWith('Smíšený')?'b-lav':'b-mint'}">${n.type}</span></div>
    <ul>${n.does.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  $('svg').setAttribute('aria-label',n.title+'. '+n.does.join(' '));
}
function overview(){
  ovMode=true;$('all').classList.add('on');$('all').textContent='Zpět na vybraný nerv';
  document.querySelectorAll('.pill').forEach(p=>p.setAttribute('aria-pressed','false'));
  groups.forEach(g=>g.classList.remove('on'));
  $('stem').setAttribute('fill','#D9CFF0');$('stem').setAttribute('stroke','#B9A9DE');
  $('panel').innerHTML=`<h2>Přehled všech nervů</h2>
   <p style="margin:2px 0 10px;font-size:.95rem">Na polykání se podílejí hlavové nervy V, VII, IX, X a XII. Někteří autoři uvádějí i nerv XI. Klepnutím na řádek otevřete detail.</p>
   ${N.map((n,i)=>`<button class="row" data-i="${i}"><span class="chip" style="background:${n.p};border-color:${n.m};color:${n.c}">${n.id}</span><span><b>${n.title}</b><small>${n.short}</small></span></button>`).join('')}`;
  $('panel').querySelectorAll('.row').forEach(r=>r.onclick=()=>{select(+r.dataset.i);window.scrollTo({top:0,behavior:'smooth'});});
}
$('prev').onclick=()=>select(cur-1);$('next').onclick=()=>select(cur+1);
$('all').onclick=()=>ovMode?select(cur):overview();
$('play').onclick=()=>select(cur);
$('labels').onchange=e=>$('svg').classList.toggle('hideLabels',!e.target.checked);
const q=new URLSearchParams(location.search);
if(q.get('n')==='all'){select(0);overview();}else select(q.has('n')?+q.get('n'):0);
})();
</script>
</body>
</html>
